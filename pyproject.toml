[tool.poetry]
name = "graphrag-anthropic-llamaindex"
version = "0.1.0"
description = "A project to replicate ms-graphrag functionality using LlamaIndex and Anthropic Claude."
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
llama-index = "^0.12.46"
anthropic = "^0.57.1"
pyyaml = "^6.0"

beautifulsoup4 = "^4.12.3"
unstructured = {extras = ["local-inference"], version = "^0.14.0"}

torch = "^2.3.0"
pandas = "^2.2.0"
pyarrow = "^16.0.0"
fsspec = "^2024.3.0"
networkx = "^3.2.1"
cdlib = "^0.1.0"
leidenalg = "^0.8.0"
cython = "^3.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"


[tool.pdm]
distribution = true

[project]
name = "graphrag-anthropic-llamaindex"
version = "0.1.0"
description = "A project to replicate ms-graphrag functionality using LlamaIndex and Anthropic Claude."
authors = [
    {name = "asopitech", email = "asopitech.iot.research+github@gmail.com"},
    {name = "Your Name", email = "you@example.com"},
]
dependencies = [
    "llama-index>=0.14.25",
    "anthropic>=2.1.0",
    "pyyaml>=6.0.3",
    "beautifulsoup4>=4.15.0",
    "unstructured[local-inference]>=0.27.34",
    "torch>=2.14.1",
    "pandas>=2.3.3",
    "pyarrow>=26.0.0",
    "fsspec>=2026.9.0",
    "networkx>=3.6.1",
    "llama-index-vector-stores-lancedb>=0.6.0",
    "llama-index-llms-anthropic>=0.12.3",
    "llama-index-embeddings-huggingface>=0.8.0",
    "graspologic-native>=1.3.1",
    "future>=1.0.0",
    "gradio>=6.30.0",
    "python-dotenv>=1.2.4",
    "lancedb>=0.40.0",
    "claude-agent-sdk>=0.2.172",
    "llama-index-readers-file>=0.7.0",
    "llama-index-llms-bedrock-converse>=0.15.5",
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {text = "MIT"}


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.17.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
