# Demo Configuration for GraphRAG with LlamaIndex and Anthropic

# Use AWS Bedrock instead of Anthropic API directly
llm_provider: "bedrock"

bedrock:
  model: "us.anthropic.claude-3-5-sonnet-20241022-v2:0"
  region: "us-east-1"

embedding_model:
  name: "sentence-transformers/all-MiniLM-L6-v2"

chunking:
  chunk_size: 1000
  chunk_overlap: 200

input_dir: "./data"
output_dir: "./demo_output"

community_detection:
  algorithm: "leiden"
  resolution: 1.0
  min_community_size: 3
  max_iterations: 100

ignore_patterns:
  - "*.tmp"
  - ".git/*"
  - "__pycache__/*"
  - "*.log"

# Enable DRIFT search (combines local entity search + global community search)
search:
  mode: "drift"  # Set to drift to enable DRIFT search
  drift:
    local_top_k: 10
    global_top_k: 5
