# Demo Configuration for GraphRAG with LlamaIndex and Anthropic

# Use AWS Bedrock instead of Anthropic API directly
llm_provider: "bedrock"

bedrock:
  model: "us.anthropic.claude-3-5-sonnet-20241022-v2:0"
  region: "us-east-1"

embedding_model:
  name: "sentence-transformers/all-MiniLM-L6-v2"

chunking:
  chunk_size: 1000
  chunk_overlap: 200

input_dir: "./data"
output_dir: "./demo_output"

vector_store:
  type: "lancedb"
  lancedb:
    uri: "./demo_output/lancedb_main"
    table_name: "vectors"

community_vector_store:
  type: "lancedb"
  lancedb:
    uri: "./demo_output/lancedb_communities"
    table_name: "community_vectors"

entity_vector_store:
  type: "lancedb"
  lancedb:
    uri: "./demo_output/lancedb_entities"
    table_name: "entity_vectors"

community_detection:
  algorithm: "leiden"
  resolution: 1.0
  min_community_size: 3
  max_iterations: 100

ignore_patterns:
  - "*.tmp"
  - ".git/*"
  - "__pycache__/*"
  - "*.log"