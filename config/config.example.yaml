# Configuration for graphrag-anthropic-llamaindex

# LLMプロバイダー選択: "claude_code" (claude CLIのサブスク認証、APIキー不要) / "anthropic" / "bedrock"
llm_provider: "claude_code"

# Claude Code使用時の設定 (事前に `claude login` が必要。個人のローカル利用専用)
claude_code:
  model: "sonnet"  # エイリアス(sonnet/opus/haiku)またはフルモデルID

# Anthropic API直接使用時の設定
anthropic:
  # api_key は環境変数 ANTHROPIC_API_KEY から取得されます
  # export ANTHROPIC_API_KEY='your-api-key' を実行してください
  model: "claude-sonnet-5-5"
  # api_base_url: "https://api.anthropic.com"

# AWS Bedrock使用時の設定
bedrock:
  model: "anthropic.claude-3-sonnet-20240229-v1:0"
  region: "us-east-1"

embedding_model:
  name: "intfloat/multilingual-e5-small"

chunking:
  chunk_size: 1024
  chunk_overlap: 20

input_dir: "./data"
output_dir: "./graphrag_output"

# Ignore patterns for file processing
ignore_patterns:
  - "*.tmp"
  - "*.log"
  - "*.cache"
  - "*.bak"
  - "*.swp"
  - "*.DS_Store"
  - "Thumbs.db"
  - ".git/*"
  - ".gitignore"
  - "__pycache__/*"
  - "*.pyc"
  - "node_modules/*"
  - ".env"
  - ".env.*"

# SQL data and all vector indexes are stored in output_dir/alopexdb.

community_detection:
  max_cluster_size: 10
  use_lcc: True
  seed: 42
