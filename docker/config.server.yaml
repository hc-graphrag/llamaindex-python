llm_provider: "anthropic"

anthropic:
  model: "claude-sonnet-5-5"

claude_code:
  model: "sonnet"

bedrock:
  model: "anthropic.claude-3-sonnet-20240229-v1:0"
  region: "us-east-1"

embedding_model:
  name: "intfloat/multilingual-e5-small"

chunking:
  chunk_size: 1024
  chunk_overlap: 20

input_dir: "/app/data"
output_dir: "/app/graphrag_output"

ignore_patterns:
  - "*.tmp"
  - "*.log"
  - "*.cache"
  - "*.bak"
  - ".git/*"
  - "__pycache__/*"

community_detection:
  max_cluster_size: 10
  use_lcc: true
  seed: 42
