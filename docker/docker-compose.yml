services:
  graphrag-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # bind mount に書かれるファイルをホストのユーザー所有にする (Makefile が設定)
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    container_name: graphrag-anthropic-app
    ports:
      - "7860:7860"
    volumes:
      # Mount local directories to container
      - ../data:/app/data:ro                    # 入力ドキュメント（読み取り専用）
      - ../graphrag_output:/app/graphrag_output # 処理結果・インデックス
      - ../config.yaml:/app/config/config.yaml:ro # 設定ファイル（読み取り専用。Gradio UIの既定パス）
      # claude_code のログイン状態 (`make claude-login` で本人が一度だけログイン。コピー・共有しない)
      - ../claude_home:/home/app/.claude
      # ログや一時ファイル用
      - graphrag-logs:/app/logs
    environment:
      # 認証情報はホスト環境または docker/.env に設定されている場合だけコンテナへ渡す。
      # `NAME=${NAME}` と書くと未設定でも空文字が渡り、認証の優先順位を乱すため素の `- NAME` を使う。
      # anthropic プロバイダ用 API キー
      - ANTHROPIC_API_KEY
      # claude_code プロバイダ用のサブスクリプション OAuth トークン (`claude setup-token` で発行)
      - CLAUDE_CODE_OAUTH_TOKEN
      # Gradio settings
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      # Python settings
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  graphrag-logs: