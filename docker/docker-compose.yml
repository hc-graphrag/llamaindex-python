services:
  alopexdb:
    profiles: ["server"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.alopex-server
      args:
        ALOPEX_VERSION: "0.8.16"
    image: graphrag-alopex-server:0.8.16
    volumes:
      - alopex-server-data:/var/lib/alopex
    expose:
      - "8080"
      - "9090"
    restart: unless-stopped

  graphrag-server:
    profiles: ["server"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    image: graphrag-llamaindex-server:latest
    command:
      - pdm
      - run
      - uvicorn
      - graphrag_anthropic_llamaindex.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      alopexdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - llamaindex-server-data:/app/data
      - ./config.server.yaml:/app/config/config.yaml:ro
      - ../claude_home:/home/app/.claude
    environment:
      - ALOPEX_SERVER_URL=http://alopexdb:8080
      - ALOPEX_SERVER_INSECURE=true
      - GRAPHRAG_CONFIG=/app/config/config.yaml
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  graphrag-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # bind mount に書かれるファイルをホストのユーザー所有にする (Makefile が設定)
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    container_name: graphrag-anthropic-app
    ports:
      # ホスト側はループバックに限定（認証なしUIをLAN/公開IPに晒さない）。
      # 外部公開が必要な場合は GRADIO_AUTH を設定した上で "0.0.0.0:7860:7860" に変更する。
      - "127.0.0.1:7860:7860"
    volumes:
      # Mount local directories to container
      - ../data:/app/data:ro                    # 入力ドキュメント（読み取り専用）
      - ../graphrag_output:/app/graphrag_output # 処理結果・インデックス
      - ../config.yaml:/app/config/config.yaml:ro # 設定ファイル（読み取り専用。Gradio UIの既定パス）
      # claude_code のログイン状態 (`make claude-login` で本人が一度だけログイン。コピー・共有しない)
      - ../claude_home:/home/app/.claude
      # ログや一時ファイル用
      - graphrag-logs:/app/logs
    environment:
      # 認証情報はホスト環境または docker/.env に設定されている場合だけコンテナへ渡す。
      # `NAME=${NAME}` と書くと未設定でも空文字が渡り、認証の優先順位を乱すため素の `- NAME` を使う。
      # anthropic プロバイダ用 API キー
      - ANTHROPIC_API_KEY
      # claude_code プロバイダ用のサブスクリプション OAuth トークン (`claude setup-token` で発行)
      - CLAUDE_CODE_OAUTH_TOKEN
      # Gradio settings
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      # Python settings
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  graphrag-logs:
  alopex-server-data:
  llamaindex-server-data:
