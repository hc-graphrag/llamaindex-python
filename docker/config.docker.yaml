# Docker コンテナ用の設定 (`make setup` がプロジェクトルートの config.yaml としてコピーします)
# コンテナ内の /app/config/config.yaml にマウントされ、Gradio UI の既定パスで読み込まれます。

# "anthropic" (環境変数 ANTHROPIC_API_KEY) / "bedrock" / "claude_code" から選びます。
# claude_code はコンテナ内に `claude` のログインが無いため、docker/.env の CLAUDE_CODE_OAUTH_TOKEN
# (`claude setup-token` で発行) が必要です。手順と注意点は docs/guides/docker-claude-subscription.md。
llm_provider: "anthropic"

claude_code:
  model: "sonnet"

anthropic:
  # api_key は環境変数 ANTHROPIC_API_KEY (docker/.env) から取得されます
  model: "claude-sonnet-5-5"

bedrock:
  model: "anthropic.claude-3-sonnet-20240229-v1:0"
  region: "us-east-1"

embedding_model:
  name: "intfloat/multilingual-e5-small"

chunking:
  chunk_size: 1024
  chunk_overlap: 20

# compose がマウントするコンテナ内のパス
input_dir: "/app/data"
output_dir: "/app/graphrag_output"

ignore_patterns:
  - "*.tmp"
  - "*.log"
  - "*.cache"
  - "*.bak"
  - "*.swp"
  - "*.DS_Store"
  - "Thumbs.db"
  - ".git/*"
  - ".gitignore"
  - "__pycache__/*"
  - "*.pyc"
  - "node_modules/*"
  - ".env"
  - ".env.*"

# AlopexDB はマウント済みの /app/graphrag_output/alopexdb に永続化される

community_detection:
  max_cluster_size: 10
  use_lcc: True
  seed: 42
